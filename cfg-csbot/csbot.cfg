// csbot: start a standard 5v5 competitive bot match from the console.
// The menu can start matches with gamemode_workshop.cfg (no bots, paused warmup,
// infinite grenades, buy anywhere); these always load the competitive config.
// Usage (console):  play_mirage   play_office   ...

alias "play_mirage" "game_type 0; game_mode 1; map de_mirage"
alias "play_inferno" "game_type 0; game_mode 1; map de_inferno"
alias "play_dust2" "game_type 0; game_mode 1; map de_dust2"
alias "play_nuke" "game_type 0; game_mode 1; map de_nuke"
alias "play_ancient" "game_type 0; game_mode 1; map de_ancient"
alias "play_anubis" "game_type 0; game_mode 1; map de_anubis"
alias "play_overpass" "game_type 0; game_mode 1; map de_overpass"
alias "play_train" "game_type 0; game_mode 1; map de_train"
alias "play_vertigo" "game_type 0; game_mode 1; map de_vertigo"
alias "play_office" "game_type 0; game_mode 1; map cs_office"
alias "play_italy" "game_type 0; game_mode 1; map cs_italy"

echo "[csbot] bot match commands: play_mirage play_inferno play_dust2 play_nuke play_ancient play_anubis play_overpass play_train play_vertigo play_office play_italy"
